<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FAF9F7">
  <title>Android Agent</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <section id="login-view" class="login-stage">
    <main class="login-card">
      <div class="mark">VH</div>
      <h1>Android Agent</h1>
      <p class="lead">设备设置与恢复</p>
      <form id="login-form">
        <label>账号<input id="login-username" value="admin" autocomplete="username" required></label>
        <label>密码<input id="login-password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">登录</button>
        <p id="login-error" class="form-error" role="alert"></p>
      </form>
    </main>
  </section>

  <div id="console-view" class="console hidden">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">VH</span><strong>Android Agent</strong></div>
      <div class="top-state"><i id="top-lamp"></i><span id="top-label">正在读取</span></div>
      <button id="logout" class="text-button">退出</button>
    </header>

    <main class="workspace">
      <section class="hero">
        <h2 id="connection-title">正在检查连接</h2>
        <p id="connection-copy">—</p>
      </section>

      <section id="setup-panel" class="panel hidden">
        <h3>等待 VoHive 发现</h3>
        <p id="discovered-server" class="discovery">尚未发现服务器</p>
        <details>
          <summary>手动配对</summary>
          <form id="pair-form" class="pair-form">
            <label>VoHive 地址<input id="pair-server" placeholder="http://192.168.1.2:7575" required></label>
            <label>配对码<input id="pair-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required></label>
            <button class="primary" type="submit">配对</button>
          </form>
        </details>
      </section>

      <section id="paired-panel" class="panel hidden">
        <h3>已配对</h3>
        <a id="open-vohive" class="primary link-button" href="#" target="_blank" rel="noreferrer">打开 VoHive</a>
        <div class="recovery-actions">
          <button id="reconnect" class="secondary">重新连接</button>
          <button id="reset-pairing" class="danger-link">解除配对</button>
        </div>
      </section>

      <section class="capability-section">
        <h3>功能</h3>
        <div class="capability-list">
          <div class="cap-row"><span>SMS</span><div class="cap-value"><strong id="sms-result">检查中</strong><small id="sms-detail">—</small></div></div>
          <div class="cap-row"><span>NET</span><div class="cap-value"><strong id="proxy-result">检查中</strong><small id="proxy-detail">—</small></div></div>
          <div class="cap-row"><span>eSIM</span><div class="cap-value"><strong id="esim-result">检查中</strong><small id="esim-detail">—</small></div></div>
        </div>
      </section>

      <details class="advanced">
        <summary>高级</summary>
        <div class="advanced-grid">
          <article>
            <h4>运行信息</h4>
            <dl id="runtime-facts"></dl>
          </article>
          <article>
            <h4>本地入口</h4>
            <div id="management-urls" class="url-list"></div>
          </article>
          <article class="credential-card">
            <h4>修改凭据</h4>
            <form id="password-form">
              <label>账号<input id="security-username" autocomplete="username" required></label>
              <label>当前密码<input id="security-current" type="password" autocomplete="current-password" required></label>
              <label>新密码<input id="security-new" type="password" minlength="12" autocomplete="new-password" required></label>
              <label>确认新密码<input id="security-confirm" type="password" minlength="12" autocomplete="new-password" required></label>
              <button class="secondary" type="submit">更新</button>
            </form>
          </article>
        </div>
      </details>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
